[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc6104-rsa-audit"
version = "0.1.0"
description = "Coursework implementation of pairwise and tree-based batch GCD for RSA public keys"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fast = ["gmpy2>=2.1"]
lab = ["pycryptodome>=3.22,<4", "cryptography>=44,<48", "matplotlib>=3.9,<4", "gmpy2>=2.2,<3"]

[project.scripts]
rsa-audit = "rsa_audit.cli:main"
rsa-lab = "rsa_lab.cli:main"

[tool.setuptools.packages.find]
include = ["rsa_audit*", "rsa_lab*"]
