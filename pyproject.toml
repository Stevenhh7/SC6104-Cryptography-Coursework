[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc6104-rsa-audit"
version = "0.1.0"
description = "Coursework implementation of pairwise and tree-based batch GCD for RSA public keys"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fast = ["gmpy2>=2.1"]

[project.scripts]
rsa-audit = "rsa_audit.cli:main"

[tool.setuptools.packages.find]
include = ["rsa_audit*"]
